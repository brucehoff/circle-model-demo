---
name: Build and push model as a Docker image

on:
  push:
    branches:
      - '*'
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+'
  pull_request:
    branches:
      - '*'

env:
  BASE_IMAGE_PATH: docker.synapse.org/${{ vars.SYNAPSE_PROJECT_ID }}/${{ github.repository }}

jobs:
  get-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: |
            ${{ env.BASE_IMAGE_PATH }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}} # major.minor.patch
            type=semver,pattern={{major}}.{{minor}}

    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      

  build_container:
    needs: get-tags
    runs-on: ubuntu-latest
    steps:
      - name: Login to Synapse Container Registry
        uses: docker/login-action@v2
        with:
          registry: docker.synapse.org
          username: ${{ github.actor }}
          password: ${{ secrets.SYNAPSE_PAT }}

      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Read parameters file
        id: read_parameters
        run: |
          parameters_json=$(cat parameters.json | jq -c .)
          echo parameters_json=${parameters_json} >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6.4.0
        with:
          context: .
          push: true
          tags: ${{ needs.get-tags.outputs.tags }}
          annotations: |
            index,manifest,manifest-descriptor:model_parameters=${{ steps.read_parameters.outputs.parameters_json }}

      - name: Get Syn ID of the repository
        id: getsynid
        run: |
          entity_id=$(curl -H "Authorization: Bearer ${{ secrets.SYNAPSE_PAT }}" https://repo-prod.prod.sagebase.org/repo/v1/entity/dockerRepo/id?repositoryName=${{ env.BASE_IMAGE_PATH }} | jq .id)
          echo entity_id $entity_id
          echo entity_id=$entity_id >> $GITHUB_OUTPUT

      - name: Add descriptive metadata
        run: |
          echo TODO: Add entity annotations for the descriptive/discovery metadata for the model

      - name: Create provenance record
        run: |
          echo TODO: Create or update a Synapse Activity linking the Docker repo' to the GitHub commit it came from
...
