---
name: Build and push model as a Docker image

on:
  push:
    branches:
      - '*'
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+'
  pull_request:
    branches:
      - '*'

jobs:
  get-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4.1.1
        with:
          images: |
            docker.synapse.org/${{ vars.SYNAPSE_PROJECT_ID }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}} # major.minor.patch
            type=semver,pattern={{major}}.{{minor}}

    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      

  build_container:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Synapse Container Registry
        uses: docker/login-action@v2
        with:
          registry: docker.synapse.org
          username: ${{ github.actor }}
          password: ${{ secrets.SYNAPSE_PAT }}

      - name: Checkout repository
        uses: actions/checkout@v4

# TODO serialize parameters.json and add as an
      - name: Build and push Docker image
        uses: docker/build-push-action@v6.4.0
        with:
          context: .
          push: true
          tags: ${{ needs.get-tags.outputs.tags }}
          annotations:
            - model_parameters: "TODO"

